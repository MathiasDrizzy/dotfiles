name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mac/tools/herdr-ctl/go.mod
          cache-dependency-path: mac/tools/herdr-ctl/go.sum

      - name: Quick harness (public-repo hygiene, syntax, herdr-ctl, zshenv)
        run: scripts/harness-quick.sh

      - name: Full install in a sandbox
        run: scripts/test-install-full.sh

      - name: Go checks (vet, test -race, golangci-lint, govulncheck)
        run: scripts/go-checks.sh

  lint:
    name: Lint shell scripts
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mac/tools/herdr-ctl/go.mod
          cache-dependency-path: mac/tools/herdr-ctl/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: shellcheck and shfmt
        run: scripts/lint-shell.sh
