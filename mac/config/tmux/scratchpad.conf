# tmux for the herdr scratchpad popup (mac/scripts/terminal-popup.sh). herdr's popups are not panes: they get no mouse
# selection of their own and pass the mouse only to a program that asks for it. tmux asks for it, so a drag copies.
set -g mouse on
set -g status off
set -g prefix None
set -g prefix2 None
set -s escape-time 0
set -g history-limit 20000
set -g destroy-unattached on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
# A drag, a double click (word) or a triple click (line) copies to the macOS clipboard when the button is released.
set -g copy-command "pbcopy"
set -g set-clipboard on

# The selection is herdr's own gray (Catppuccin Mocha surface2), not tmux's yellow, and the "[0/0]" position tag is hidden.
set -g mode-style "fg=#cdd6f4,bg=#585b70"
set -g copy-mode-position-format ""
