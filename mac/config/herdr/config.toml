{ token = "$quota_context_danger", fg = "#df919b", bold = false, dim = false }], [{ token = "$quota_5h_normal", fg = "#98b17d", bold = false, dim = false }, { token = "$quota_5h_warning", fg = "#dec27f", bold = false, dim = false }, { token = "$quota_5h_danger", fg = "#df919b", bold = false, dim = false }, { token = "$quota_5h_unknown", bold = false, dim = false }], [{ token = "$quota_week_inline_normal", fg = "#98b17d", bold = false, dim = false }, { token = "$quota_week_inline_warning", fg = "#dec27f", bold = false, dim = false }, { token = "$quota_week_inline_danger", fg = "#df919b", bold = false, dim = false }, { token = "$quota_week_inline_unknown", bold = false, dim = false }, { token = "$quota_week_normal", fg = "#98b17d", bold = false, dim = false }, { token = "$quota_week_warning", fg = "#dec27f", bold = false, dim = false }, { token = "$quota_week_danger", fg = "#df919b", bold = false, dim = false }, { token = "$quota_week_unknown", bold = false, dim = false }], [{ token = "$quota_month_normal", fg = "#98b17d", bold = false, dim = false }, { token = "$quota_month_warning", fg = "#dec27f", bold = false, dim = false }, { token = "$quota_month_danger", fg = "#df919b", bold = false, dim = false }, { token = "$quota_month_unknown", bold = false, dim = false }], [{ token = "$quota_nest_gap", bold = false, dim = false }]] # herdr-agent-usage-row

# Atajos nativos de herdr (Rust)
[keys]
# Navegación entre cuadros con flechas (Non-Vim, nativo Rust)
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
focus_pane_up = "prefix+up"
focus_pane_down = "prefix+down"

# Intercambiar posición de cuadros con Shift + Flechas (Nativo Rust)
swap_pane_left = "prefix+shift+left"
swap_pane_right = "prefix+shift+right"
swap_pane_up = "prefix+shift+up"
swap_pane_down = "prefix+shift+down"

# Reordenar pestañas (Nativo Rust)
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

# herdr-sidebar: abrir / enfocar / cerrar la barra
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-sidebar.open-sidebar"
description = "toggle sidebar (explorer)"

# herdr-sidebar: buscar archivo por nombre (como Ctrl+P de VS Code)
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-sidebar.quick-open"
description = "sidebar quick open"

# termscp: explorador SFTP/FTP de dos paneles (tipo lazygit) en popup
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "/opt/homebrew/bin/termscp"
description = "termscp (sftp)"
width = "90%"
height = "90%"

# sshs: elegir servidor de ~/.ssh/config y conectarse por SSH (pane temporal)
[[keys.command]]
key = "prefix+s"
type = "pane"
command = "/opt/homebrew/bin/sshs"
description = "sshs (ssh hosts)"

# sidebar-adapt: ajusta el ancho del sidebar según pantalla conectada (auto/laptop/external)
[[keys.command]]
key = "prefix+m"
type = "shell"
command = "/Users/drizzy/.local/bin/herdr-ctl adapt"
description = "sidebar adapt"

# cheatsheet: atajos de herdr y herramientas del entorno (ctrl+b h)
[[keys.command]]
key = "prefix+h"
type = "popup"
command = "/Users/drizzy/.local/bin/herdr-ctl cheatsheet"
description = "cheatsheet (atajos y comandos)"
width = 82
height = 26

# shiki: notas + tareas + imagenes (TUI tipo yazi) en pane temporal a pantalla completa
# Usa el lanzador del build parcheado (ver 3.5.9), NO /opt/homebrew/bin/shiki
[[keys.command]]
key = "prefix+o"
type = "pane"
command = "/Users/drizzy/.local/bin/shiki-herdr"
description = "shiki (notas y tareas)"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-usage.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-usage.open-settings"
description = "open agent quota settings"

# ==============================================================================
# Mover cuadro a otra pestaña
# ==============================================================================
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "/Users/drizzy/.local/bin/herdr-ctl move-tab new"
description = "mover cuadro a nueva pestaña"

