onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg = "reset"
# No filled block behind the active space (it was a flat gray rectangle that hid the text): the active space is the
# bold, bright one. selection_bg stays at herdr's default: it only fills the row under the cursor while navigating.
active_row_bg = "reset"
# Neutral gray separators (visible over the bluish Ghostty background)
surface0 = "#6b6b75"
surface1 = "#6b6b75"
overlay0 = "#8a8a94"
overlay1 = "#a0a0aa"

[ui]
# UI layout modeled after victor-falcon's gist: shared dividers, framed panes
prompt_new_tab_name = false
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
pane_gaps = false
copy_on_select = true

[ui.sidebar.agents]
row_gap = 0
# herdr paints by focus only the `workspace` token, which these rows cannot use (the agent's name is its session's, not
# its space's), so `herdr-ctl spaces-watch` puts the name in one of two tokens: $aname_dim, or $aname_hot while the
# agent's pane is the one in front. The hot one is the active space's look: bold, the theme's text color.
rows = [
  ["state_icon", { token = "$aname_dim" }, { token = "$aname_hot", fg = "#cdd6f4", bold = true }, { token = "$model", dim = true }],
  ["state_text", "$ctx"],
  [{ token = "$limits5h", dim = true }],
  [{ token = "$limitsWeek", dim = true }],
]

[ui.sidebar.spaces]
row_gap = 0
# Each repository of the space (herdr-ctl spaces-sync), as a tree even when there is one: its name on a row and its
# branch and state below it. Rows left empty are hidden. The tree's line is part of each row and herdr puts " · "
# between a row's tokens, so name and branch rows are both dimmed: the line reads as one, the state stays bright.
rows = [
  ["state_icon", "workspace"],
  [{ token = "$repo1", dim = true }],
  [{ token = "$repo1b", dim = true }, "$repo1s"],
  [{ token = "$repo2", dim = true }],
  [{ token = "$repo2b", dim = true }, "$repo2s"],
  [{ token = "$repo3", dim = true }],
  [{ token = "$repo3b", dim = true }, "$repo3s"],
  [{ token = "$repo4", dim = true }],
  [{ token = "$repo4b", dim = true }, "$repo4s"],
  [{ token = "$repo5", dim = true }],
  [{ token = "$repo5b", dim = true }, "$repo5s"],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"


# Atajos nativos de herdr (Rust)
[keys]
# Navegación entre cuadros con flechas (Non-Vim, nativo Rust)
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
focus_pane_up = "prefix+up"
focus_pane_down = "prefix+down"

# Intercambiar posición de cuadros con Shift + Flechas (Nativo Rust)
swap_pane_left = "prefix+shift+left"
swap_pane_right = "prefix+shift+right"
swap_pane_up = "prefix+shift+up"
swap_pane_down = "prefix+shift+down"

# Reordenar pestañas (Nativo Rust)
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

# lazyfinder: abrir / enfocar / cerrar el sidebar (plugin de herdr; se abre solo a la izquierda en cada pestaña)
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "lazyfinder.toggle"
description = "toggle lazyfinder sidebar"

# terminal: scratchpad provisorio (cerrar con Esc, Ctrl+D o exit). Es un pane temporal de herdr y no un popup: un popup no es
# un pane (herdr lo trata como recurso de sesión), así que no se podía copiar ni pegar en él; un pane sí (copy mode, mouse, pegado).
[[keys.command]]
key = "prefix+t"
type = "pane"
command = "/Users/drizzy/.local/bin/terminal-popup"
description = "terminal provisoria (scratchpad)"

# cheatsheet: atajos de herdr y herramientas del entorno (ctrl+b h)
[[keys.command]]
key = "prefix+h"
type = "popup"
command = "/Users/drizzy/.local/bin/herdr-ctl cheatsheet"
description = "cheatsheet (atajos y comandos)"
width = 82
height = 26

# ==============================================================================
# Mover cuadro a otra pestaña
# ==============================================================================
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "/Users/drizzy/.local/bin/herdr-ctl move-tab new"
description = "mover cuadro a nueva pestaña"

