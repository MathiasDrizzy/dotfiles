onboarding = false

[theme]
name = "catppuccin"

[ui]
agent_panel_sort = "spaces" # herdr-agent-usage

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[ui.sidebar]

[ui.sidebar.agents]
row_gap = 0 # herdr-agent-usage
