# AeroSpace: i3-like tiling window manager (no SIP changes needed).
# Docs: https://nikitabobko.github.io/AeroSpace/guide  ·  reload the config: option+shift+ñ, then Esc

config-version = 2

# JankyBorders: a thin purple round border on the focused window only (inactive windows get none).
# It detects an already running instance, so an AeroSpace restart does not start it twice.
after-startup-command = [
    # SketchyBar detects an already running instance, so an AeroSpace restart does not start it twice.
    'exec-and-forget sketchybar',
    'exec-and-forget borders style=round width=2.0 hidpi=on active_color=0xccb48efa inactive_color=0x00000000'
]
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

automatically-unhide-macos-hidden-apps = false

# Numbered workspaces only. Letter workspaces (alt-a ... alt-z) are left out on purpose:
# alt-b, alt-f and alt-d are the shell's word motions (Option is Alt in Ghostty).
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9"]

focus-follows-mouse.enabled = false
# AeroSpace reads key names as physical US-qwerty positions. This keyboard is Latin American, so the punctuation keys
# sit elsewhere: these aliases name the keys by the symbol printed on them.
key-mapping.key-notation-to-key-code.latamMinus = 'slash'               # the key labelled "-"
key-mapping.key-notation-to-key-code.latamPlus = 'rightSquareBracket'   # the key labelled "+"
key-mapping.key-notation-to-key-code.latamNtilde = 'semicolon'          # the key labelled "ñ"

gaps.inner.horizontal = 6
gaps.inner.vertical = 6
gaps.outer.left = 6
gaps.outer.bottom = [{ monitor.secondary = 12 }, 6]
gaps.outer.top = 6
gaps.outer.right = 6

# System Settings is not meant to be tiled, nor are the windows of Vorssaint (it lives in its menu, SketchyBar's planet).
on-window-detected = [
    { if = 'test %{app-bundle-id} = com.apple.systempreferences', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.vorssaint.utils', run = 'layout floating' },
]

# Tell SketchyBar which workspace is focused.
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Two sets of nine: 1..9 live on the Mac (Option+N), e1..e9 on the external monitor (Control+Option+N). The bar draws e3 as
# a 3 in the external monitor's pill. Without an external monitor, e1..e9 fall back to the Mac.
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'
e1 = ['secondary', 'main']
e2 = ['secondary', 'main']
e3 = ['secondary', 'main']
e4 = ['secondary', 'main']
e5 = ['secondary', 'main']
e6 = ['secondary', 'main']
e7 = ['secondary', 'main']
e8 = ['secondary', 'main']
e9 = ['secondary', 'main']

[mode.main.binding]
    # Arrow keys instead of vim keys (h/j/k/l).
    alt-enter = 'exec-and-forget open -na Ghostty'

    alt-period = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-shift-space = 'layout floating tiling'    # toggle floating / tiling for the focused window
    # Snail layout for 3 windows: first one big on the left, the other two stacked on the right.
    # AeroSpace has no automatic dwindle layout, so this rebuilds it on demand.
    alt-shift-s = ['flatten-workspace-tree', 'layout tiles horizontal', 'focus --dfs-index 1', 'join-with right']
    alt-shift-enter = 'fullscreen'

    alt-left = 'focus left'
    alt-down = 'focus down'
    alt-up = 'focus up'
    alt-right = 'focus right'

    alt-shift-left = 'move left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move right'

    alt-latamMinus = 'resize smart -50'
    alt-latamPlus = 'resize smart +50'

    # Previous / next workspace, like ctrl+arrows did for the native desktops.
    ctrl-alt-left = 'workspace --wrap-around prev'
    ctrl-alt-right = 'workspace --wrap-around next'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'


    ctrl-alt-1 = 'workspace e1'
    ctrl-alt-2 = 'workspace e2'
    ctrl-alt-3 = 'workspace e3'
    ctrl-alt-4 = 'workspace e4'
    ctrl-alt-5 = 'workspace e5'
    ctrl-alt-6 = 'workspace e6'
    ctrl-alt-7 = 'workspace e7'
    ctrl-alt-8 = 'workspace e8'
    ctrl-alt-9 = 'workspace e9'

    ctrl-alt-shift-1 = 'move-node-to-workspace e1'
    ctrl-alt-shift-2 = 'move-node-to-workspace e2'
    ctrl-alt-shift-3 = 'move-node-to-workspace e3'
    ctrl-alt-shift-4 = 'move-node-to-workspace e4'
    ctrl-alt-shift-5 = 'move-node-to-workspace e5'
    ctrl-alt-shift-6 = 'move-node-to-workspace e6'
    ctrl-alt-shift-7 = 'move-node-to-workspace e7'
    ctrl-alt-shift-8 = 'move-node-to-workspace e8'
    ctrl-alt-shift-9 = 'move-node-to-workspace e9'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-latamNtilde = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']          # reset layout
    f = ['layout floating tiling', 'mode main']          # toggle floating / tiling
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-left = ['join-with left', 'mode main']
    alt-shift-down = ['join-with down', 'mode main']
    alt-shift-up = ['join-with up', 'mode main']
    alt-shift-right = ['join-with right', 'mode main']
